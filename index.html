
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Engineering Training</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #fffc00;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
}
.card {
  background: white;
  padding: 35px;
  border-radius: 18px;
  width: 320px;
  max-width: 85vw;
  text-align: center;
  box-shadow: 0 8px 30px #0002;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 8px;
}
input { border: 1px solid #ccc; }
button {
  background: #fffc00;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}
small { color: #666; }
</style>
</head>
<body>
<div class="card">
  <h2>👻 Social Engineering Lab</h2>
  <p>Snapchat-inspired login simulation</p>
  <small>Training only — do not enter real credentials.</small>

  <form id="demo">
    <input id="username" placeholder="Test username" required>
    <input id="password" type="password"
      placeholder="Test password" required>
    <button type="submit">Login (Simulation)</button>
  </form>

  <p id="result"></p>
</div>

<script>
document.getElementById("demo").addEventListener("submit", e => {
  e.preventDefault();

  const username = document.getElementById("username").value;
  document.getElementById("result").textContent =
    "Simulation complete for " + username +
    ". Never enter real passwords on unverified websites.";

  document.getElementById("password").value = "";
});
</script>
</body>
</html>
