
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cybersecurity Demo Lab</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 32px;
  border-radius: 18px;
  box-shadow: 0 12px 35px #00000012;
}

h1 {
  text-align: center;
  font-size: 24px;
}

.subtitle {
  text-align: center;
  color: #666;
  font-size: 13px;
  line-height: 1.6;
}

label {
  display: block;
  margin: 20px 0 8px;
  font-size: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 24px;
  background: #2458e8;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  font-size: 14px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.note {
  font-size: 12px;
  color: #666;
  text-align: center;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
  <h1>Cybersecurity Demo Lab</h1>

  <p class="subtitle">
    Enter two non-sensitive test usernames.
    Both values will be sent to the demo Discord channel.
  </p>

  <form id="demoForm">
    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      maxlength="40"
      autocomplete="off"
      required
    >

    <label for="username2">Username 2</label>
    <input
      id="username2"
      type="text"
      maxlength="40"
      autocomplete="off"
      required
    >

    <button type="submit" id="sendButton">
      Send Demo
    </button>
  </form>

  <div class="result" id="result"></div>

  <p class="note">
    Demo Only — Do not enter passwords or real credentials.
  </p>
</div>

<script>
const WORKER_URL =
  "https://soft-wildflower-8b8f.gxdhdehdd.workers.dev/";

const form = document.getElementById("demoForm");
const result = document.getElementById("result");
const sendButton = document.getElementById("sendButton");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const username2 =
    document.getElementById("username2").value.trim();

  if (!username || !username2) {
    result.textContent = "Please enter both usernames.";
    return;
  }

  sendButton.disabled = true;
  result.textContent = "Sending demo...";

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        event: "demo_usernames",
        username: username,
        username2: username2
      })
    });

    if (!response.ok) {
      throw new Error("Request failed");
    }

    result.replaceChildren();

    const first = document.createElement("div");
    first.textContent = "Username: " + username;

    const second = document.createElement("div");
    second.textContent = "Username 2: " + username2;

    const status = document.createElement("div");
    status.textContent = "Sent to Discord successfully!";
    status.style.color = "green";

    result.append(first, second, status);
  } catch (error) {
    result.textContent =
      "Could not send the demo. Check the Worker settings.";
    result.style.color = "#b42318";
  } finally {
    sendButton.disabled = false;
  }
});
</script>

</body>
</html>
